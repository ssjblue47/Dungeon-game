<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dungeon Crawler</title>
<style>
body{background:#121212;color:#fff;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
#game{width:520px;background:#1e1e1e;padding:20px;border-radius:10px}
#log{height:220px;background:#000;padding:10px;overflow-y:auto;margin:10px 0}
button{width:100%;padding:10px;margin:5px 0;background:#333;color:#fff;border:none;cursor:pointer}
</style>
</head>

<body>
<div id="game">
<h1>Dungeon Crawler</h1>

<div>
HP: <span id="hp">100</span> |
ATK: <span id="atk">10</span> |
DEF: <span id="def">5</span> |
Room: <span id="room">0/8</span>
</div>

<div id="log"></div>
<div id="actions"></div>
</div>

<script>
const game={
player:{hp:100,maxHp:100,atk:10,def:5},
enemy:null,
room:0,
maxRooms:8,
state:"CREATION"
};

const logDiv=document.getElementById("log");

function log(msg){
const d=document.createElement("div");
d.innerHTML=msg;
logDiv.appendChild(d);
logDiv.scrollTop=logDiv.scrollHeight;
}

function updateUI(){
hp.innerText=game.player.hp;
atk.innerText=game.player.atk;
def.innerText=game.player.def;
room.innerText=`${game.room}/${game.maxRooms}`;
}

function btn(text,fn){
const b=document.createElement("button");
b.innerText=text;
b.onclick=fn;
actions.appendChild(b);
}

function clear(){actions.innerHTML="";}

function render(){
clear();

if(game.state==="CREATION"){
log("Choose your trait:");
btn("Strong (+5 ATK)",()=>{game.player.atk+=5;nextRoom();});
btn("Tank (+20 HP)",()=>{game.player.hp+=20;game.player.maxHp+=20;nextRoom();});
btn("Shield (+5 DEF)",()=>{game.player.def+=5;nextRoom();});
}

else if(game.state==="ROOM"){
log("Choose a path:");
btn("⬅ Left Path",()=>enterRoom());
btn("➡ Right Path",()=>enterRoom());
}

else if(game.state==="COMBAT"){
btn("Punch",()=>turn("Punch"));
btn("Counter",()=>turn("Counter"));
btn("Quick",()=>turn("Quick"));
}

else if(game.state==="GAMEOVER"){
btn("Restart",reset);
}

else if(game.state==="WIN"){
btn("Play Again",reset);
}
}

function nextRoom(){
game.room++;
if(game.room>game.maxRooms){
startBoss();
return;
}
game.state="ROOM";
render();
}

function enterRoom(){
const roll=Math.random();

if(roll<0.5){
startCombat();
}
else if(roll<0.75){
loot();
nextRoom();
}
else{
trap();
nextRoom();
}
}

function startCombat(){
game.enemy={
hp:30+game.room*10,
atk:8+game.room*2,
def:3+game.room
};
game.state="COMBAT";
log("Enemy appears!");
render();
}

function startBoss(){
game.enemy={hp:150,atk:20,def:10,boss:true};
game.state="COMBAT";
log("🔥 BOSS FIGHT 🔥");
render();
}

function turn(p){
const moves=["Punch","Counter","Quick"];
const e=moves[Math.floor(Math.random()*3)];

log(`You:${p} | Enemy:${e}`);

let result="draw";

if(p===e) result="draw";
else if(
(p==="Punch"&&e==="Counter")||
(p==="Counter"&&e==="Quick")||
(p==="Quick"&&e==="Punch")
) result="win";
else result="lose";

if(result==="win"){
let dmg=Math.max(5,game.player.atk-game.enemy.def);
game.enemy.hp-=dmg;
log("You deal "+dmg);
}
else if(result==="lose"){
let dmg=Math.max(5,game.enemy.atk-game.player.def);
game.player.hp-=dmg;
log("Enemy deals "+dmg);
}
else log("Draw");

if(game.enemy.boss && Math.random()<0.3){
log("Boss uses special attack!");
game.player.hp-=15;
}

updateUI();

if(game.player.hp<=0){
log("You died!");
game.state="GAMEOVER";
render();
return;
}

if(game.enemy.hp<=0){
if(game.enemy.boss){
log("🏆 YOU BEAT THE BOSS!");
game.state="WIN";
render();
return;
}
log("Enemy defeated!");
heal();
nextRoom();
return;
}
}

function loot(){
const type=Math.floor(Math.random()*3);

if(type===0){
game.player.atk+=3;
log("Loot: +3 ATK");
}
if(type===1){
game.player.def+=3;
log("Loot: +3 DEF");
}
if(type===2){
game.player.maxHp+=10;
game.player.hp+=10;
log("Loot: +10 HP");
}
updateUI();
}

function trap(){
const dmg=10+Math.floor(Math.random()*10);
game.player.hp-=dmg;
log("Trap! You lose "+dmg+" HP");
updateUI();
}

function heal(){
game.player.hp=Math.min(game.player.maxHp,game.player.hp+15);
log("You heal 15 HP");
}

function reset(){
game.player={hp:100,maxHp:100,atk:10,def:5};
game.room=0;
game.state="CREATION";
logDiv.innerHTML="";
updateUI();
render();
}

updateUI();
render();
</script>

</body>
</html>
